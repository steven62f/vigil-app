name: Build

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend (TypeScript + Vite)
        run: npm run build

      - name: Test frontend (Vitest)
        run: npm run test

      - name: Build vigil-claude/codex/grok/antigravity/kimi (release, requis par tauri.conf.json resources)
        run: cargo build --release -p vigil-claude -p vigil-codex -p vigil-grok -p vigil-antigravity -p vigil-kimi

      - name: Build Rust (workspace)
        run: cargo build --workspace

      - name: Test Rust (workspace)
        run: cargo test --workspace
        # NOTE: Le build NSIS (npm run tauri build) n'est PAS exécuté en CI.
        # La génération de l'installateur signé est réservée au release local (npm run build:release).
